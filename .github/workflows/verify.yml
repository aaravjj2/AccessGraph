name: Verify AccessGraph demo

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/clinical_agent, services/orchestrator, services/policy_agent]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests
        run: |
          if [ -f pyproject.toml ]; then pytest; else python -m unittest discover; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "charan's work"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "charan's work/package-lock.json"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
